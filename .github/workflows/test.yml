name: test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # the notes tests run the real safety scan
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: make check
